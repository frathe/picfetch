name: Microsoft Store package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install fyne-cross CLI
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Store-managed Windows executables
        run: make package-windows-store

      - name: Upload Store-managed Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: picfetch-microsoft-store-executables
          path: bin/picfetch-microsoft-store-*.exe
          if-no-files-found: error

  package:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Store-managed Windows executables
        uses: actions/download-artifact@v8
        with:
          name: picfetch-microsoft-store-executables
          path: dist/executables

      - name: Stage x64 and ARM64 packages
        shell: pwsh
        run: |
          go run ./scripts/msixstage -arch amd64 -exe dist/executables/picfetch-microsoft-store-amd64.exe -out dist/stage-x64
          go run ./scripts/msixstage -arch arm64 -exe dist/executables/picfetch-microsoft-store-arm64.exe -out dist/stage-arm64

      - name: Pack and bundle with the Windows SDK
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter MakeAppx.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\MakeAppx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $makeappx) {
            throw 'MakeAppx.exe was not found in the Windows SDK.'
          }

          New-Item -ItemType Directory -Force -Path dist/packages | Out-Null
          & $makeappx.FullName pack /v /h SHA256 /d dist/stage-x64 /p dist/packages/picfetch-x64.msix
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx failed for the x64 package.' }
          & $makeappx.FullName pack /v /h SHA256 /d dist/stage-arm64 /p dist/packages/picfetch-arm64.msix
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx failed for the ARM64 package.' }
          & $makeappx.FullName bundle /v /d dist/packages /p dist/picfetch-microsoft-store.msixbundle
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx failed to create the MSIX bundle.' }

      - name: Sign bundle for local certification testing
        shell: pwsh
        run: |
          $publisher = 'CN=D9654E56-586C-4C1E-ABC8-71CCDC33B78F'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'PicFetch Microsoft Store CI' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          $trusted = New-Object System.Security.Cryptography.X509Certificates.X509Store('TrustedPeople', 'LocalMachine')
          $trusted.Open('ReadWrite')
          $trusted.Add($cert)
          $trusted.Close()

          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter SignTool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\SignTool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw 'SignTool.exe was not found in the Windows SDK.'
          }
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint dist/picfetch-microsoft-store.msixbundle
          if ($LASTEXITCODE -ne 0) { throw 'SignTool failed to sign the MSIX bundle.' }
          & $signtool.FullName verify /pa /all /v dist/picfetch-microsoft-store.msixbundle
          if ($LASTEXITCODE -ne 0) { throw 'SignTool failed to verify the MSIX bundle.' }

      - name: Run Windows App Certification Kit
        shell: pwsh
        run: |
          $appcert = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path -LiteralPath $appcert -PathType Leaf)) {
            throw 'Windows App Certification Kit was not found.'
          }
          & $appcert reset
          if ($LASTEXITCODE -ne 0) { throw 'Windows App Certification Kit reset failed.' }
          & $appcert test -appxpackagepath dist/picfetch-microsoft-store.msixbundle -reportoutputpath dist/wack-report.xml
          if ($LASTEXITCODE -ne 0) { throw 'Windows App Certification Kit rejected the MSIX bundle.' }

      - name: Upload Microsoft Store bundle and certification report
        uses: actions/upload-artifact@v7
        with:
          name: picfetch-microsoft-store
          path: |
            dist/picfetch-microsoft-store.msixbundle
            dist/wack-report.xml
          if-no-files-found: error
