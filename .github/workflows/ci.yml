name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release workflow gates on exactly these checks rather
  # than a copy of them that can drift - a tag push doesn't match the
  # branch/PR triggers above, so without this a release ran no tests at all.
  workflow_call:

concurrency:
  # github.workflow is the caller's name for reusable-workflow runs. Keep the
  # ordinary Release and Microsoft Store package gates for the same tag from
  # cancelling each other while still cancelling superseded runs of either.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -tags=no_emoji

jobs:
  validation:
    name: Validation (attempt ${{ github.run_attempt }})
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Check generated tag vectors
        run: make check-tag-vectors

      - name: Check generated artwork
        run: make check-app-assets

      - name: Check GitHub TUF root expiry
        run: make check-tuf-root

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Validate UI shard manifest
        run: make check-test-shards-direct

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Cross-build Windows
        # ./internal/... rather than ./... - the root package pulls in
        # Fyne's glfw driver, and go-gl/gl's build constraints exclude every
        # file for a Windows cross-compile target, so `go build ./...` for
        # GOOS=windows fails here on the main package alone. That's a
        # pre-existing Fyne cross-build gap, not something this change can
        # fix; internal/... still covers every //go:build windows file,
        # including internal/ui.
        run: |
          GOOS=windows GOARCH=amd64 go build ./internal/...
          GOOS=windows GOARCH=arm64 go build ./internal/...

      - name: Vet Windows
        # Same ./internal/... scope as Cross-build Windows above, and for
        # the same reason.
        run: GOOS=windows GOARCH=amd64 go vet ./internal/...

  linux-race:
    name: Linux race (${{ matrix.partition }}, attempt ${{ github.run_attempt }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        partition: [non-ui, ui-1, ui-2, ui-3]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Run ${{ matrix.partition }} race contract (attempt ${{ github.run_attempt }})
        id: race
        env:
          TEST_CAPTURE: ${{ runner.temp }}/go-test-linux-race-${{ matrix.partition }}.json
        run: |
          case "${{ matrix.partition }}" in
            non-ui)
              make --no-print-directory test-race-non-ui-direct
              ;;
            ui-1|ui-2|ui-3)
              make --no-print-directory test-race-ui-direct TEST_SHARD="${{ matrix.partition }}"
              ;;
            *)
              echo "Unexpected Linux race partition: ${{ matrix.partition }}" >&2
              exit 2
              ;;
          esac

      - name: Summarize ${{ matrix.partition }} race result (attempt ${{ github.run_attempt }})
        if: always()
        env:
          PARTITION: ${{ matrix.partition }}
          RACE_OUTCOME: ${{ steps.race.outcome }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            echo "## Linux race \`$PARTITION\` (attempt \`$RUN_ATTEMPT\`)"
            echo
            echo "- Workflow attempt: \`$RUN_ATTEMPT\`"
            echo "- Test step outcome: \`$RACE_OUTCOME\`"
            echo "- Raw-event artifact: \`linux-race-$PARTITION-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.partition }} raw events (attempt ${{ github.run_attempt }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-race-${{ matrix.partition }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-linux-race-${{ matrix.partition }}.json
          if-no-files-found: error
          retention-days: 14

  windows-test:
    name: Windows tests (attempt ${{ github.run_attempt }})
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Execute native Windows guards
        run: go run ./scripts/nativeguards -suite windows -capture "${{ runner.temp }}/native-guards-windows.json"

      - name: Execute Microsoft Store distribution guards
        run: go run ./scripts/nativeguards -suite store -capture "${{ runner.temp }}/native-guards-store.json"

      - name: Upload native guard events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-guards-${{ runner.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-guards-*.json
          if-no-files-found: error
          retention-days: 14

  macos-test:
    name: macOS ${{ matrix.arch }} native guards (attempt ${{ github.run_attempt }})
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Execute Cocoa-linked macOS guards
        run: go run ./scripts/nativeguards -suite macos -capture "${{ runner.temp }}/native-guards-macos.json"

      - name: Check Explorer runtime selection and worker exit
        run: go test ./internal/ort ./internal/similarity ./scripts/explorereval -count=1

      - name: Qualify Intel Explorer download and offline inference
        if: matrix.arch == 'amd64'
        run: make explorer-install-test

      - name: Upload native guard events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-guards-${{ runner.os }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-guards-*.json
          if-no-files-found: error
          retention-days: 14
