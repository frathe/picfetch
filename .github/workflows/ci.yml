name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release workflow gates on exactly these checks rather
  # than a copy of them that can drift - a tag push doesn't match the
  # branch/PR triggers above, so without this a release ran no tests at all.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Check GitHub TUF root expiry
        run: make check-tuf-root

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # The runner's default locale is "C", which is not a well-formed
        # BCP-47 tag, so Fyne logs a three-line parse fault before any test
        # runs. Naming a real one keeps that noise out of the test output.
        #
        # -timeout 20m: go test defaults to 10m per package. internal/ui on
        # ubuntu-latest already took ~9m39s before folder-sibling tests; the
        # next commit then panicked at 10m0s while a later test was starting.
        env:
          LANG: en_US.UTF-8
        run: go test -timeout 20m -race ./...
